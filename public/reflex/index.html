<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test de Réflexe — Mesurez votre temps de réaction</title>
<meta name="description" content="Testez votre temps de réaction en millisecondes. Cliquez dès que l'écran change de couleur. Gratuit, jouez directement dans votre navigateur.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
    *,*::before,*::after{box-sizing:border-box;}
    :root{
        --accent:#E8542A;
        --accent-soft:color-mix(in srgb, var(--accent) 10%, white);
        --ink:#18181f; --ink-muted:#6b6877; --ink-faint:#9a96a3;
        --paper:#ffffff; --line:#f0e5e1;
        --radius-md:10px; --radius-lg:16px;
        --serif:'Fraunces',serif; --sans:'Inter',system-ui,sans-serif;
        --go:#16a34a; --wait:#dc2626;
    }
    html{background:#fff;}
    body{
        font-family:var(--sans); max-width:720px; margin:0 auto;
        padding:36px 20px 60px;
        background:
            radial-gradient(900px 480px at 8% -8%, color-mix(in srgb, var(--accent) 10%, white) 0%, transparent 60%),
            #ffffff;
        color:var(--ink); font-size:14px;
    }
    .brand .eyebrow{display:block;font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.09em;color:var(--accent);margin-bottom:4px;}
    .brand h1{font-family:var(--serif);font-weight:700;font-size:27px;margin:0;letter-spacing:-.01em;}
    .lede{font-size:14px;color:var(--ink-muted);max-width:540px;margin:6px 0 24px;}

    .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
    .stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px;text-align:center;}
    .stat .num{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--accent);}
    .stat .lbl{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}

    .zone{
        height:380px; border-radius:var(--radius-lg); border:1px solid var(--line);
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        cursor:pointer; user-select:none; transition:background .08s;
        background:#f4f4f7; text-align:center; padding:20px;
    }
    .zone.state-idle{background:#f4f4f7;}
    .zone.state-wait{background:var(--wait); color:#fff;}
    .zone.state-go{background:var(--go); color:#fff;}
    .zone.state-early{background:#7c2d12; color:#fff;}
    .zone.state-result{background:var(--accent-soft);}

    .zone-icon{font-size:44px;margin-bottom:14px;}
    .zone-title{font-family:var(--serif);font-weight:700;font-size:22px;margin:0 0 8px;}
    .zone-sub{font-size:13.5px;opacity:.85;max-width:340px;}

    .result-time{font-family:var(--serif);font-weight:700;font-size:56px;color:var(--accent);margin:6px 0;}
    .result-msg{font-size:13.5px;color:var(--ink-muted);margin-bottom:14px;}

    .history{margin-top:20px;}
    .history-title{font-size:11.5px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
    .history-list{display:flex;flex-wrap:wrap;gap:8px;}
    .history-chip{padding:6px 12px;border-radius:99px;background:var(--paper);border:1px solid var(--line);font-size:12.5px;color:var(--ink-muted);font-weight:500;}
    .history-chip.best{border-color:var(--accent);color:var(--accent);font-weight:700;}

    .btn-reset{margin-top:16px;background:none;border:none;color:var(--ink-faint);font-size:13px;cursor:pointer;text-decoration:underline;display:block;margin-left:auto;margin-right:auto;}
</style>
</head>
<body>

<div class="brand">
    <span class="eyebrow">Studio SEO — Outils</span>
    <h1>Test de Réflexe</h1>
</div>
<p class="lede">Cliquez dès que l'écran devient vert. Attention : si vous cliquez trop tôt, vous devrez recommencer.</p>

<div class="stats-row">
    <div class="stat"><div class="num" id="stat-last">—</div><div class="lbl">Dernier essai</div></div>
    <div class="stat"><div class="num" id="stat-best">—</div><div class="lbl">Meilleur temps</div></div>
    <div class="stat"><div class="num" id="stat-avg">—</div><div class="lbl">Moyenne</div></div>
</div>

<div class="zone state-idle" id="zone" onclick="onZoneClick()">
    <i class="ti ti-hand-click zone-icon"></i>
    <div class="zone-title">Cliquez pour commencer</div>
    <div class="zone-sub">L'écran passera au rouge, puis au vert de façon aléatoire.</div>
</div>

<div class="history" id="history" style="display:none;">
    <div class="history-title">Historique de la partie</div>
    <div class="history-list" id="history-list"></div>
</div>

<button class="btn-reset" id="btn-reset" style="display:none;" onclick="resetAll()">Réinitialiser les statistiques</button>

<script>
    const zone = document.getElementById('zone');
    let state = 'idle'; // idle | wait | go | early | result
    let timeoutId = null;
    let startTime = 0;
    let times = [];

    function setZone(newState, iconClass, title, sub){
        state = newState;
        zone.className = 'zone state-' + newState;
        zone.innerHTML = `<i class="ti ${iconClass} zone-icon"></i><div class="zone-title">${title}</div><div class="zone-sub">${sub}</div>`;
    }

    function onZoneClick(){
        if(state === 'idle' || state === 'result'){
            startRound();
        } else if(state === 'wait'){
            // Clicked too early
            clearTimeout(timeoutId);
            setZone('early', 'ti-alert-triangle', 'Trop tôt !', 'Attendez que l\'écran devienne vert avant de cliquer. Cliquez pour réessayer.');
            state = 'earlyWaitingClick';
        } else if(state === 'earlyWaitingClick'){
            startRound();
        } else if(state === 'go'){
            const elapsed = Math.round(performance.now() - startTime);
            registerTime(elapsed);
        }
    }

    function startRound(){
        setZone('wait', 'ti-clock', 'Attendez...', 'L\'écran va devenir vert. Ne cliquez pas trop tôt.');
        const delay = 1200 + Math.random() * 2500;
        timeoutId = setTimeout(() => {
            startTime = performance.now();
            setZone('go', 'ti-bolt', 'Cliquez maintenant !', '');
        }, delay);
    }

    function registerTime(ms){
        times.push(ms);
        const best = Math.min(...times);
        const avg = Math.round(times.reduce((a,b)=>a+b,0) / times.length);

        document.getElementById('stat-last').textContent = ms + ' ms';
        document.getElementById('stat-best').textContent = best + ' ms';
        document.getElementById('stat-avg').textContent = avg + ' ms';

        let msg = 'Correct ! Cliquez pour rejouer.';
        if(ms < 200) msg = 'Impressionnant ! Cliquez pour rejouer.';
        else if(ms > 500) msg = 'Vous pouvez faire mieux. Cliquez pour rejouer.';

        setZone('result', 'ti-check', ms + ' ms', msg);
        // Override title with big number style via custom render
        zone.innerHTML = `<div class="result-time">${ms} ms</div><div class="result-msg">${msg}</div>`;

        updateHistory();
        document.getElementById('btn-reset').style.display = 'block';
    }

    function updateHistory(){
        const list = document.getElementById('history-list');
        const best = Math.min(...times);
        list.innerHTML = times.map(t => `<span class="history-chip ${t===best?'best':''}">${t} ms</span>`).join('');
        document.getElementById('history').style.display = 'block';
    }

    function resetAll(){
        times = [];
        document.getElementById('stat-last').textContent = '—';
        document.getElementById('stat-best').textContent = '—';
        document.getElementById('stat-avg').textContent = '—';
        document.getElementById('history').style.display = 'none';
        document.getElementById('btn-reset').style.display = 'none';
        setZone('idle', 'ti-hand-click', 'Cliquez pour commencer', 'L\'écran passera au rouge, puis au vert de façon aléatoire.');
    }
</script>

</body>
</html>
